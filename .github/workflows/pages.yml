name: Publish NevisSanj site
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/index.html'
      - 'dist/style.css'
      - 'dist/vendor/**'
      - 'dist/fonts/**'
      - 'models/published/**'
      - 'tsconfig.json'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        run: npm install --no-audit --no-fund
      - name: Compile the React + TypeScript frontend
        run: npm run build
      - name: Publish only the public site and approved models
        shell: bash
        run: |
          rm -rf dist/models && mkdir -p dist/models
          shopt -s nullglob
          for item in models/published/*.json models/published/*.onnx; do cp "$item" dist/models/; done
          rm -f dist/app.js.map
          touch dist/.nojekyll
          if [ -d admin_data ]; then echo 'Private training data must never enter the public artifact'; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy static website
        id: deploy
        uses: actions/deploy-pages@v4
